# GitLab CI/CD 配置文件
# 使用 Jib 构建和推送 Docker 镜像到私有仓库

stages:
  - build
  - test
  - package
  - deploy

variables:
  # 镜像仓库配置（可以通过 GitLab CI/CD Variables 覆盖）
  DOCKER_REGISTRY: "${CI_REGISTRY}"  # GitLab Container Registry
  DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}"  # 如 registry.gitlab.com/group/project 或 hubar.it.com/image
  DOCKER_TAG: "${CI_COMMIT_SHORT_SHA}"  # 使用提交 SHA 作为标签

# 构建阶段
build:
  stage: build
  image: gradle:8.5-jdk17
  script:
    - ./gradlew build
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 hour
  only:
    - branches
    - tags

# 测试阶段
test:
  stage: test
  image: gradle:8.5-jdk17
  script:
    - ./gradlew test
  artifacts:
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    expire_in: 1 week
  only:
    - branches
    - tags

############################################
# 第一步 jib 打包到本地 -> 第二步 trivy 扫描 -> 第三步 推送到仓库
# 三步在同一 job 内完成（镜像在本地 Docker 守护进程中）
############################################

package:
  stage: package
  image: gradle:8.5-jdk17
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERT_PATH: ""
  before_script:
    # 安装 Docker 客户端与 Trivy（连接 dind 守护进程）
    - apt-get update -qq && apt-get install -y -qq docker.io > /dev/null
    - |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - docker info
  script:
    # 第一步：gradlew jib 打包到本地（jibDockerBuild，不推送）
    - |
      ./gradlew --no-daemon jibDockerBuild \
        -Pjib.to.image="${DOCKER_IMAGE}:${DOCKER_TAG}" \
        -Pjib.to.image.credHelper= \
        --info
    # 第二步：trivy image <镜像名:tag> 扫描本地镜像，并输出 JSON 报告
    - trivy image "${DOCKER_IMAGE}:${DOCKER_TAG}" --format json -o trivy-report.json --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
    # 第三步：推送到仓库（扫描通过后才执行）
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker push "${DOCKER_IMAGE}:${DOCKER_TAG}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${DOCKER_IMAGE}:${DOCKER_TAG}" "${DOCKER_IMAGE}:latest"
        docker push "${DOCKER_IMAGE}:latest"
      fi
  only:
    - branches
    - tags

# 部署阶段（示例）
deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "部署镜像: ${DOCKER_IMAGE}:${DOCKER_TAG}"
    - echo "这里可以添加部署脚本，例如 kubectl、docker-compose 等"
  only:
    - main
    - master
  when: manual

# 清理旧镜像（可选）
cleanup:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      echo "清理旧镜像..."
      # 使用 GitLab API 清理旧镜像
      # 需要配置 GITLAB_API_TOKEN 变量
  only:
    - schedules
  when: manual
